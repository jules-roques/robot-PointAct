# DEPRECATED as a launch input -- kept for compatibility, do not edit for new work.
#
# Run configuration now lives in one yaml per run under experiments/13_robocasa365/runs/,
# which carries its own `data:` block; nothing launches from this file any more. It survives
# because checkpoints archived before that change record this path in their
# training_args.json, and eval_robocasa365.sh reads it to recover the sampling mode. Deleting
# it would make those evals unable to tell how their policy was trained.
#
# PointAct point-cloud data config for RoboCasa365 OpenDrawer (target/human split).
# Mirrors experiments/2_libero/data_configs/data-libero-*-point-frontview.yaml, adapted to
# the RoboCasa365 PandaOmron dataset produced by data_prep/robocasa365_to_lerobot.
#
# `root` is resolved relative to the training CWD (repo root). Create the symlink once:
#   ln -s $SCRATCH/datasets/robot_data robot_data
# so that robot_data/robocasa365/lerobot_point_lmdb/OpenDrawer resolves.

mm_datasets:

lerobot_datasets:

  - repo_id: OpenDrawer
    root: robot_data/robocasa365/lerobot_point_lmdb
    class_name: LeRobotPointCloudDataset

    # RoboCasa365 saves three cameras: left / right / wrist (agentview_left,
    # agentview_right, eye_in_hand). We feed the VLM the two external agentviews (left + right)
    # for scene context, but NOT the egocentric wrist view. video_key_ids_for_vlm indexes into
    # select_video_keys: [0,1] = left + right.
    select_video_keys: [observation.images.left_image, observation.images.right_image]
    video_key_ids_for_vlm: [0, 1]

    select_state_keys: [observation.state]
    select_action_keys: [action]

    # Action layout (13-d, from pointact/robot_envs/robocasa365_utils/environments.py):
    #   [eef_pos(3), eef_quat_xyzw(4), gripper_close(1), base_motion(4), control_mode(1)]
    # After quat->rot6d the action head sees 15-d (< max_action_dim=32, so the same model
    # architecture fits with no change).
    converted_rot_type: rot6d  # euler, rot6d

    # RoboCasa365 PandaOmron eef actions are absolute pose targets (not deltas, unlike Libero).
    is_delta_action: False

    # Robot-base-frame workspace from RoboCasa365Env.get_points_workspace(). The replay
    # already crops/voxelizes points into the points_3views LMDB; re-cropping here to the
    # same box is a safe no-op and documents the volume. Use null to skip re-cropping.
    points_workspace: {
      'X_BBOX': [-0.8, 0.8],   # 0 = robot base
      'Y_BBOX': [-0.8, 0.8],   # 0 = robot base
      'Z_BBOX': [0.0, 1.0],    # 0 = floor
    }

    max_npoints: 4096
    augment_pc_rot: 30
    point_cloud_dirname: points_3views

    # Generate with data_prep/prepare_robot_state_action_stats.py (see README). The eef
    # rotation quat sits at action[3:7] and state[3:7]; note the state ALSO carries a base
    # rotation quat at [12:16] that a single --state_rotation_slice does not convert — verify
    # this matches how you want the state normalized.
    state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/OpenDrawer/robot_state_action_stats/rot6d.json
