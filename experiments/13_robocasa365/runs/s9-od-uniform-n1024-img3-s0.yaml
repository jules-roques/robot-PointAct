# OpenDrawer / uniform / 1024 points / 3 camera views via cached frozen-VLM context -- stage 9.
# Uniform sampling: the baseline draw. Stage 7's text-only twin is at 45.6% (n=500), the arm images are most likely to help.
# Identical to s7-od-uniform-n1024-s0 except for the context: see _base_3views_framecache.yaml.
extends: _base_3views_framecache.yaml

meta:
  task: OpenDrawer
  sampling: uniform
  npoints: 1024
  context: frame_cache
  seed: 0
  stage: "Stage 9: Cached image context (3 views)"

train:
  run_name: s9-od-uniform-n1024-img3-s0

data:
  lerobot_datasets:
    - repo_id: OpenDrawer
      state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/OpenDrawer/robot_state_action_stats/rot6d.json
      max_npoints: 1024
