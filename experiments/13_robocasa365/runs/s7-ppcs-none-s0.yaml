# PickPlaceCounterToStove / no input sampler / whole 1 cm cloud, 30K steps -- stage 7.
# The top of the budget axis: no sampler at all, so the network sees every occupied voxel
# (median 24.3K points, p95 33.1K, max 36.1K). Read against the 16384 arms it says how much the
# discarded tail carries, and against 512 it bounds what the whole axis is worth.
#
# Stage 6 ran OpenDrawer only, so unlike the od arm there was never an
# existing no-sampler run to reuse here -- this one is fresh by default,
# not by choice.
extends: _base.yaml

meta:
  task: PickPlaceCounterToStove
  sampling: none
  # No npoints coordinate on purpose: exp_npoints is the *configured budget*, and this arm has
  # none. max_npoints below is a cap set above the cloud size so that nothing binds; recording
  # 32768 would label an arm that trains on ~22K points as a 32768-point arm.
  context: text_cache
  seed: 0
  stage: "Stage 7: Point budget x sampler (Utonia)"

train:
  max_steps: 30000
  run_name: s7-ppcs-none-s0
  output_base: $SCRATCH/PointAct_exprs/robocasa365/stage7

  # ~24.3K points per sample, the largest cloud in the grid; 32 OOMs even at OpenDrawer's smaller size (stage 6). effective_batch
  # stays 128, which is the quantity that has to match across the grid.
  per_device_train_batch_size: 16

data:
  lerobot_datasets:
    - repo_id: PickPlaceCounterToStove
      state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/PickPlaceCounterToStove/robot_state_action_stats/rot6d.json
      text_context_file: text_context/qwen2.5-vl-3b.pt
      # A cap, not a target: augment_point_cloud() draws int(len(cloud) * U(0.8, 1.0))
      # regardless, so the 0-20% dropout every other arm has is preserved. Setting the cap
      # above the cloud size removes only the budget. smoke_stage5.py fails this arm if the
      # cap ever binds, which would silently turn it back into a large uniform draw.
      max_npoints: 65536
