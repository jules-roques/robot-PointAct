# OpenDrawer / anchor / 2048 points -- stage A.
# Oracle/anchor sampling: same density, centred on the ground-truth handle from
# MuJoCo segmentation. Privileged info -- an upper bound, not a deployable policy.
extends: _base.yaml

meta:
  task: OpenDrawer
  sampling: anchor
  npoints: 2048
  context: text_cache
  seed: 0
  stage: A

data:
  lerobot_datasets:
    - max_npoints: 2048
      eef_sampling: true
      eef_sampling_sigma: 0.08
      eef_sampling_floor: 0.05
      roi_point_cloud_dirname: points_3views_labels
