# TurnOnMicrowave / eef / 4096 points -- stage B.
# EEF-density sampling: weight-proportional draw under a Gaussian-with-floor
# density centred on the frame's own end-effector position. No cache needed.
extends: _base.yaml

meta:
  task: TurnOnMicrowave
  sampling: eef
  npoints: 4096
  context: text_cache
  seed: 0
  stage: B

data:
  lerobot_datasets:
    - repo_id: TurnOnMicrowave
      state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/TurnOnMicrowave/robot_state_action_stats/rot6d.json
      max_npoints: 4096
      eef_sampling: true
      eef_sampling_sigma: 0.08
      eef_sampling_floor: 0.05
