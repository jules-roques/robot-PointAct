# PickPlaceCounterToStove / uniform / 8192 points, 30K steps -- stage 5.
# Uniform point subsample: the baseline draw, and the control every other arm
# in this grid is read against.
extends: _base.yaml

meta:
  task: PickPlaceCounterToStove
  sampling: uniform
  npoints: 8192
  context: text_cache
  seed: 0
  stage: "Stage 5: Five tasks x four samplers"

train:
  max_steps: 30000

data:
  lerobot_datasets:
    - repo_id: PickPlaceCounterToStove
      state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/PickPlaceCounterToStove/robot_state_action_stats/rot6d.json
      text_context_file: text_context/qwen2.5-vl-3b.pt
      max_npoints: 8192
