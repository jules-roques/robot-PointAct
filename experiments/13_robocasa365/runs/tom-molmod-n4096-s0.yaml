# TurnOnMicrowave / MolmoPoint anchor, depth lift + eef fallback / 4096 points -- stage 5.
#
# The task the depth lift helps most. Against the cloud-lifted cache this arm was trained on:
# median error 13.2 -> 6.7 cm, within-sigma 33.1% -> 55.4%, usable 27.6% -> 46.2%, and
# anchors landing closer to the WRONG button 44.8% -> 37.7%. The mechanism is depth mixing:
# a pixel window on the voxelised cloud sees the button and the wall behind it through the
# gaps between voxels, and the median of that lands between them.
#
# Still expect a modest policy result. The two buttons are 5.4 cm apart, so within-sigma
# does not imply on-target even now, and the stage-3 arm landed exactly on uniform
# (59% vs 59%) with eef at 65%. 16.7% of frames remain unanchored; those now draw around
# the gripper, which on this task is worth roughly the difference between uniform and eef.
#
# The pointing query is deliberately UNCHANGED from the one the cache was built with --
# only the lift and the fallback differ, so this is comparable to the stage-3 arm.
extends: _base.yaml

meta:
  task: TurnOnMicrowave
  sampling: molmo-depth
  npoints: 4096
  context: text_cache
  seed: 0
  stage: "Stage 5: MolmoPoint depth-lifted anchor"

data:
  lerobot_datasets:
    - repo_id: TurnOnMicrowave
      state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/TurnOnMicrowave/robot_state_action_stats/rot6d.json
      text_context_file: text_context/qwen2.5-vl-3b.pt
      max_npoints: 4096
      molmo_sampling: true
      molmo_anchor_dirname: points_3views_molmo_depth_w5
      # One query: "Point to the start button on the microwave."
      molmo_anchor_ids: [0]
      molmo_sampling_sigma: 0.08
      molmo_sampling_floor: 0.05
      molmo_fallback: eef
