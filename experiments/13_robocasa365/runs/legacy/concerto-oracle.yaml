# Legacy with-VLM run: OpenDrawer / anchor sampling, 20 epochs.
# Replaces train_pointact_concerto_oracle.sh.
# run_name and output_dir are the strings that script produced, so this resumes the
# archived run rather than starting a parallel copy.
extends: _base_vlm.yaml

meta:
  task: OpenDrawer
  sampling: anchor
  npoints: 4096
  context: vlm
  seed: 0
  stage: legacy
train:
  run_name: data-robocasa365-opendrawer-point-oracle-rot6d-image.leftright_ck16_lr5e-5_eb128_epoch20
  output_dir: $SCRATCH/PointAct_exprs/robocasa365/pointact/VLAEncDec3DWithActionRegressionModel-concerto-data-robocasa365-opendrawer-point-oracle-rot6d-image.leftright_ck16_lr5e-5_eb128_epoch20-freeze.vlm
data:
  mm_datasets: null
  lerobot_datasets:
  - repo_id: OpenDrawer
    root: robot_data/robocasa365/lerobot_point_lmdb
    class_name: LeRobotPointCloudDataset
    select_video_keys:
    - observation.images.left_image
    - observation.images.right_image
    video_key_ids_for_vlm:
    - 0
    - 1
    select_state_keys:
    - observation.state
    select_action_keys:
    - action
    converted_rot_type: rot6d
    is_delta_action: false
    points_workspace:
      X_BBOX:
      - -0.8
      - 0.8
      Y_BBOX:
      - -0.8
      - 0.8
      Z_BBOX:
      - 0.0
      - 1.0
    max_npoints: 4096
    augment_pc_rot: 30
    point_cloud_dirname: points_3views
    state_action_norm_file: robot_data/robocasa365/lerobot_point_lmdb/OpenDrawer/robot_state_action_stats/rot6d.json
    oracle_sampling: true
    oracle_label_dirname: points_3views_labels
    oracle_anchor_labels:
    - 4
    oracle_anchor_fallback_labels:
    - 3
    oracle_sampling_sigma: 0.08
    oracle_sampling_floor: 0.05
